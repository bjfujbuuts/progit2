name: Auto Commit

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan setiap jam 12 malam UTC

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update file dummy
        run: |
          echo "Commit pada: $(date)" >> dummy.txt
          
      - name: Commit dan Push
        run: |
          git config --global user.name "Nama Kamu"
          git config --global user.email "email.github@kamu.com"
          git add dummy.txt
          git commit -m "Auto commit harian"
          git push
          
